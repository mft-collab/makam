name: Makam CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── 1. Kod Kalitesi ve Test ────────────────────────────────────────────────
  quality:
    name: Kalite Kontrolü
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Kontrol (Lint)
        run: npm run lint

      - name: Testleri Çalıştır
        run: npm test

      - name: Test Kapsamı Raporu
        run: npm run test:coverage
        continue-on-error: true

      - name: Kapsam Raporunu Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── 2. Production Build ────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Build Artifaktını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── 3. Firebase Hosting Deploy (sadece main branch) ───────────────────────
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Firebase Hosting'e Deploy Et
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

  # ─── 4. Pull Request Preview Deploy ────────────────────────────────────────
  preview:
    name: PR Preview Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Firebase Preview Channel Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # PR başına otomatik preview URL oluşturur — ücretsiz Firebase Hosting özelliği
