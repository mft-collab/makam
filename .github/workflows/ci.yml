name: Makam CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── 0. Güvenlik Taraması ────────────────────────────────────────────────────
  security:
    name: Güvenlik Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gizli Anahtar Taraması (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Bağımlılık Güvenlik Denetimi
        # NOT: audit-level=critical olarak ayarlandı çünkü kalan "high" seviye
        # bulgular yalnızca firebase-admin (google-gax/@grpc/grpc-js zinciri,
        # server-side Admin SDK) ve @lhci/cli (dev-only) major sürüm
        # atlamasıyla çözülüyor ve build zincirini kırma riski taşıyor.
        # vite açığı (GHSA-fx2h-pf6j-xcff) 6.4.3 patch güncellemesiyle çözüldü.
        # Bkz. takip: Faz 3.3 bağımlılık modernizasyonu.
        run: npm audit --audit-level=critical

  # ─── 1. Kod Kalitesi ve Test ────────────────────────────────────────────────
  quality:
    name: Kalite Kontrolü
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Kontrol (Lint)
        run: npm run lint

      - name: ESLint (kod kalitesi, a11y, Firestore rules)
        run: npm run eslint

      - name: Testleri Çalıştır
        run: npm test

      - name: Test Kapsamı Raporu
        run: npm run test:coverage
        continue-on-error: true

      - name: Kapsam Raporunu Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── 2. Production Build ────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [quality, security]
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Build Artifaktını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── 2b. Performans Bütçeleri (bundle boyutu + Lighthouse) ─────────────────
  performance:
    name: Performans Bütçeleri
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Bundle Boyutu Bütçesi
        run: npm run size

      - name: Lighthouse CI (a11y, best-practices, SEO, perf)
        # NOT: accessibility/best-practices/seo "error" seviyesinde gerçek bir
        # kapı — build'i kırar. performance şimdilik "warn" (bkz. lighthouserc.json):
        # mevcut skor (~0.57) büyük ölçüde firebase/pdf/chart vendor paketlerinden
        # kaynaklanıyor ve ayrı bir bundle-optimizasyon çalışması gerektiriyor.
        run: npm run lighthouse

  # ─── 3. Firebase Hosting Deploy (sadece main branch) ───────────────────────
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    needs: [build, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Firebase CLI Kur
        run: npm install -g firebase-tools

      # NOT: firestore.rules/firestore.indexes.json eskiden hiç deploy
      # edilmiyordu — yalnızca hosting deploy ediliyordu (bkz. kod denetimi:
      # repo'ya eklenen bir rules/index değişikliği production'a hiç
      # ulaşmıyor, yalnızca manuel `firebase deploy` veya konsol üzerinden
      # taşınabiliyordu). Hosting'den ÖNCE çalışır ki yeni bir rules/index'e
      # bağımlı bir client değişikliği hosting'e çıktığında ilgili rules/index
      # zaten yerinde olsun.
      - name: Firestore Rules & Indexes Deploy Et
        run: firebase deploy --only firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # NOT: FirebaseExtended/action-hosting-deploy@v0 (servis hesabı JSON
      # anahtarı) yerine `firebase login:ci` ile üretilen kişisel bir CI
      # token'ı kullanılıyor — servis hesabı anahtarı üretimi GCP proje kotasına
      # takılmıştı, CI token'ı bu kotadan bağımsız. Proje hedefi .firebaserc'teki
      # "default": "makam-1453"'ten geliyor, ayrıca bir PROJECT_ID secret'ı
      # gerekmiyor.
      - name: Firebase Hosting'e Deploy Et
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─── 4. Pull Request Preview Deploy ────────────────────────────────────────
  preview:
    name: PR Preview Deploy
    runs-on: ubuntu-latest
    needs: [build, performance]
    if: github.event_name == 'pull_request'

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Firebase CLI Kur
        run: npm install -g firebase-tools

      # PR başına otomatik preview kanalı oluşturur (ücretsiz Firebase Hosting
      # özelliği) — kanal adı PR numarasına sabitlenir ki aynı PR'a yapılan
      # sonraki push'lar aynı kanalı güncellesin, her seferinde yeni kanal
      # açmasın. 7 gün sonra otomatik silinir.
      - name: Firebase Preview Channel Deploy
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --token "$FIREBASE_TOKEN" --expires 7d --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
