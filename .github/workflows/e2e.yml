name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# En az ayrıcalık ilkesi — bu workflow repo içeriğini okumaktan fazlasına
# ihtiyaç duymuyor (bkz. ci.yml'deki aynı gerekçe).
permissions:
  contents: read

# Aynı PR'a art arda push'larda önceki (henüz bitmemiş) 60 dakikalık koşuları
# iptal eder — aksi halde eskiler kuyruklanıp gereksiz Actions dakikası
# tüketiyordu (bkz. kod denetimi).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  test-authenticated:
    name: Kimlik Doğrulamalı E2E (Firebase Emulator)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: lts/*

    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install Firebase CLI
      # test:e2e:emulator, `firebase emulators:exec` çağırır (bare `firebase`
      # binary'si PATH'te olmalı) — proje bağımlılığı değil, sadece yerel
      # geliştirme CLI'ı olduğundan burada ayrıca kurulması gerekiyor.
      run: npm install -g firebase-tools

    - name: Run authenticated e2e tests against Firebase Emulator Suite
      run: npm run test:e2e:emulator

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: playwright-report-authenticated
        path: playwright-report/
        retention-days: 30
