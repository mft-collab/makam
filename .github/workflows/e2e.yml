name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  test-authenticated:
    name: Kimlik Doğrulamalı E2E (Firebase Emulator)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install Firebase CLI
      # test:e2e:emulator, `firebase emulators:exec` çağırır (bare `firebase`
      # binary'si PATH'te olmalı) — proje bağımlılığı değil, sadece yerel
      # geliştirme CLI'ı olduğundan burada ayrıca kurulması gerekiyor.
      run: npm install -g firebase-tools

    - name: Run authenticated e2e tests against Firebase Emulator Suite
      run: npm run test:e2e:emulator

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-authenticated
        path: playwright-report/
        retention-days: 30
